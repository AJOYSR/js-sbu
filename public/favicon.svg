<svg width="260" height="260" viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .primary {
      fill: #0F72E5;
    }
    .secondary {
      fill: #0F0F0F;
    }
    
    @media (prefers-color-scheme: dark) {
      .primary {
        fill: #3D90FF;
      }
      .secondary {
        fill: white;
      }
    }
  </style>
  <!-- Main document/page shape -->
  <rect x="40" y="40" width="180" height="180" rx="20" class="secondary" />
  
  <!-- Content blocks representing a website builder -->
  <rect x="60" y="70" width="140" height="25" rx="6" class="primary" />
  <rect x="60" y="110" width="80" height="80" rx="6" class="primary" />
  <rect x="150" y="110" width="50" height="25" rx="6" class="primary" />
  <rect x="150" y="145" width="50" height="45" rx="6" class="primary" />
</svg>
