<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Dots -->
  <g filter="url(#glow)">
    <circle cx="10%" cy="20%" r="1" fill="white" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="25%" cy="15%" r="1" fill="white" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="40%" cy="30%" r="1" fill="white" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="60%" cy="10%" r="1" fill="white" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="75%" cy="25%" r="1" fill="white" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="90%" cy="15%" r="1" fill="white" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="4s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="15%" cy="50%" r="1" fill="white" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="30%" cy="60%" r="1" fill="white" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="45%" cy="75%" r="1" fill="white" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="4.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="65%" cy="65%" r="1" fill="white" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="80%" cy="80%" r="1" fill="white" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="95%" cy="70%" r="1" fill="white" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="4.3s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="5%" cy="85%" r="1" fill="white" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="20%" cy="90%" r="1" fill="white" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="35%" cy="95%" r="1" fill="white" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="55%" cy="85%" r="1" fill="white" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="70%" cy="95%" r="1" fill="white" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="85%" cy="90%" r="1" fill="white" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Lines connecting some dots -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="0.5">
    <line x1="10%" y1="20%" x2="25%" y2="15%" />
    <line x1="25%" y1="15%" x2="40%" y2="30%" />
    <line x1="40%" y1="30%" x2="60%" y2="10%" />
    <line x1="60%" y1="10%" x2="75%" y2="25%" />
    <line x1="75%" y1="25%" x2="90%" y2="15%" />
    
    <line x1="15%" y1="50%" x2="30%" y2="60%" />
    <line x1="30%" y1="60%" x2="45%" y2="75%" />
    <line x1="45%" y1="75%" x2="65%" y2="65%" />
    <line x1="65%" y1="65%" x2="80%" y2="80%" />
    <line x1="80%" y1="80%" x2="95%" y2="70%" />
    
    <line x1="5%" y1="85%" x2="20%" y2="90%" />
    <line x1="20%" y1="90%" x2="35%" y2="95%" />
    <line x1="35%" y1="95%" x2="55%" y2="85%" />
    <line x1="55%" y1="85%" x2="70%" y2="95%" />
    <line x1="70%" y1="95%" x2="85%" y2="90%" />
  </g>
</svg> 